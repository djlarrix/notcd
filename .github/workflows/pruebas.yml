name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -q

  extension:
    name: extensión .mcpb (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --extra dev
      - name: Armar la extensión (valida el manifiesto con mcpb)
        run: uv run python scripts/empaquetar.py
      - name: Instalarla y conectarse como lo hace la app de escritorio
        shell: bash
        run: uv run python scripts/comprobar_extension.py dist/notcd-*.mcpb
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: notcd
          path: dist/

  instalador-mac:
    name: comando de instalación (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: El comando de una línea, tal como lo pega un abogado
        env:
          NOTCD_REF: ${{ github.sha }}
          NOTCD_SIN_LOGIN: "1"
          NOTCD_SIN_DESKTOP: "1"
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/instalar.sh" | bash
      - name: La app de código puede lanzar el servidor registrado
        run: ~/.local/bin/uv run --no-project --with "mcp>=2.3,<3" python scripts/comprobar_instalacion.py
      - name: Diagnóstico
        run: ~/.local/bin/notcd diagnostico || true

  instalador-windows:
    name: comando de instalación (Windows PowerShell 5)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: El comando de una línea, tal como lo pega un abogado (con el Python oficial descargado de python.org)
        shell: powershell
        run: |
          $env:NOTCD_REF = '${{ github.sha }}'
          $env:NOTCD_SIN_LOGIN = '1'
          $env:NOTCD_SIN_DESKTOP = '1'
          $env:NOTCD_DESCARGAR_PYTHON = '1'
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/instalar.ps1 | iex
          if (-not (Test-Path "$env:USERPROFILE\.local\bin\notcd.cmd")) { throw 'notcd no quedó instalado' }
      - name: Lo que abre la app tiene firma digital válida (lo exige el Control inteligente de aplicaciones)
        shell: powershell
        run: |
          $entorno = "$env:USERPROFILE\.notcd\entorno"
          $py = Join-Path $entorno 'Scripts\python.exe'
          $base = ((Get-Content (Join-Path $entorno 'pyvenv.cfg') | Where-Object { $_ -match '^home\s*=' }) -replace '^home\s*=\s*', '').Trim()
          Write-Host "Python base: $base"
          foreach ($exe in @($py, (Join-Path $base 'python.exe'))) {
            $firma = Get-AuthenticodeSignature $exe
            Write-Host "$exe -> $($firma.Status) · $($firma.SignerCertificate.Subject)"
            if ($firma.Status -ne 'Valid') { throw "sin firma válida: $exe" }
          }
          if ($base -notlike "$env:LOCALAPPDATA\Programs\Python\Python312*") { throw "no usó el Python descargado de python.org: $base" }
          $compiladas = @(Get-ChildItem -Path (Join-Path $entorno 'Lib\site-packages') -Recurse -Include *.pyd, *.dll | ForEach-Object { $_.Name })
          if ($compiladas.Count -gt 0) { throw "hay bibliotecas compiladas, que Windows puede bloquear: $($compiladas -join ', ')" }
          Write-Host 'Ninguna biblioteca compilada en el entorno de notcd.'
          & "$env:USERPROFILE\.local\bin\notcd.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'el comando notcd no funciona' }
      - name: Iniciar sesión con el Chrome y el Edge instalados (sin cuenta, sólo la mecánica)
        shell: powershell
        run: |
          & "$env:USERPROFILE\.notcd\entorno\Scripts\python.exe" scripts\comprobar_navegador.py chrome edge
          if ($LASTEXITCODE -ne 0) { throw 'el inicio de sesión con el navegador instalado falló' }
      - name: Identificar qué programa tiene tomado un archivo
        shell: powershell
        run: |
          $env:NOTCD_SOLO_FUNCIONES = '1'
          Invoke-Expression (Get-Content -Raw .\instalar.ps1)
          $dir = Join-Path $env:RUNNER_TEMP 'bloqueo'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $archivo = Join-Path $dir 'prueba.dll'
          Set-Content -Path $archivo -Value 'x'
          $h = [System.IO.File]::Open($archivo, 'Open', 'Read', 'None')
          try { $quien = @(Get-ProcesosQueBloquean @($dir)) } finally { $h.Close() }
          Write-Host "Detectado: $quien"
          if (-not ($quien -match "\|$PID\|")) { throw "no detectó el bloqueo: $quien" }
      - name: Actualizar con un archivo de notcd tomado por otro programa (como un antivirus)
        shell: powershell
        run: |
          $env:BLOQUEAR = "$env:USERPROFILE\.notcd\entorno\Lib\site-packages\notcd\__init__.py"
          if (-not (Test-Path $env:BLOQUEAR)) { throw "no existe $env:BLOQUEAR" }
          # Otro proceso toma el archivo 20 segundos y no se puede cerrar desde el instalador
          # (su línea de comandos no menciona notcd), igual que un antivirus.
          Start-Process powershell -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', '$h = [IO.File]::Open($env:BLOQUEAR, ''Open'', ''Read'', ''None''); Start-Sleep -Seconds 20; $h.Close()'
          Start-Sleep -Seconds 3
          $env:NOTCD_REF = '${{ github.sha }}'
          $env:NOTCD_SIN_LOGIN = '1'
          $env:NOTCD_SIN_DESKTOP = '1'
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/instalar.ps1 | iex
          Write-Host "--- registro de la instalación ---"
          Write-Host (Get-Content "$env:USERPROFILE\.notcd\instalacion.log" -Raw)
          $version = & "$env:USERPROFILE\.local\bin\notcd.cmd" --version
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'notcd no quedó instalado' }
          Write-Host "Instalado: $version"
      - name: Simular el conector de notcd en uso (como si la app lo tuviera abierto)
        shell: powershell
        run: |
          $python = "$env:USERPROFILE\.notcd\entorno\Scripts\python.exe"
          Start-Process -FilePath $python -ArgumentList '-c', '"import time; time.sleep(900)"', '-m', 'notcd', 'servidor' -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $vivos = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match '-m notcd servidor' })
          if ($vivos.Count -eq 0) { throw 'no se pudo simular el conector en uso' }
      - name: Dejar bibliotecas compiladas de una versión anterior (como el equipo bloqueado)
        shell: powershell
        run: |
          & "$env:USERPROFILE\.local\bin\uv.exe" pip install --python "$env:USERPROFILE\.notcd\entorno\Scripts\python.exe" pydantic-core
          if ($LASTEXITCODE -ne 0) { throw 'no se pudo preparar la prueba' }
      - name: El mismo comando otra vez (actualizar con el conector en uso)
        shell: powershell
        run: |
          $env:NOTCD_REF = '${{ github.sha }}'
          $env:NOTCD_SIN_LOGIN = '1'
          $env:NOTCD_SIN_DESKTOP = '1'
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/instalar.ps1 | iex
          if (-not (Test-Path "$env:USERPROFILE\Documents\notcd\notcd.zip")) { throw 'no se generó la skill' }
          $vivos = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match '-m notcd servidor' })
          if ($vivos.Count -ne 0) { throw 'el conector en uso no se detuvo antes de actualizar' }
          $compiladas = @(Get-ChildItem -Path "$env:USERPROFILE\.notcd\entorno\Lib\site-packages" -Recurse -Include *.pyd, *.dll)
          if ($compiladas.Count -gt 0) { throw 'quedaron bibliotecas compiladas de la versión anterior' }
      - name: La app de código puede lanzar el servidor registrado
        shell: powershell
        run: |
          & "$env:USERPROFILE\.local\bin\uv.exe" run --no-project --with "mcp>=2.3,<3" python scripts/comprobar_instalacion.py
          if ($LASTEXITCODE -ne 0) { throw 'la comprobación falló' }
      - name: Diagnóstico
        shell: powershell
        run: |
          & "$env:USERPROFILE\.local\bin\notcd.cmd" diagnostico
          exit 0
